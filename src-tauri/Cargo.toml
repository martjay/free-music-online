[package]
name = "anhe-player"
version = "1.0.53"
description = "AnhePlayer Tauri v2 Core"
authors = ["raclen"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-opener = "2.0"
tauri-plugin-http = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "socks"] }
winreg = "0.55"
dirs = "5.0"
log = "0.4"
env_logger = "0.11"
open = "5.1"
tiny_http = "0.12"
lofty = "0.25"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
name = "anhe_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
